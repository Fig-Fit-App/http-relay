name: Docker

on:
  push:
    branches: [main]

# GITEA_TOKEN cannot publish packages. Create a personal access token
# (Settings → Applications → Generate token, packages write) and store it
# as the repository secret PACKAGE_TOKEN.
permissions:
  contents: read
  packages: write

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push service image
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITEA_TOKEN }}
          SERVER_URL: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
          ACTOR: ${{ gitea.actor }}
          COMMIT_SHA: ${{ gitea.sha }}
        run: |
          REGISTRY_HOST="${SERVER_URL#*://}"
          IMAGE="$REGISTRY_HOST/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')/service"
          printf '%s' "$PACKAGE_TOKEN" | docker login "$REGISTRY_HOST" -u "$ACTOR" --password-stdin
          docker build -f apps/service/Dockerfile -t "$IMAGE:latest" -t "$IMAGE:$COMMIT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$COMMIT_SHA"

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push docs image
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITEA_TOKEN }}
          SERVER_URL: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
          ACTOR: ${{ gitea.actor }}
          COMMIT_SHA: ${{ gitea.sha }}
        run: |
          REGISTRY_HOST="${SERVER_URL#*://}"
          IMAGE="$REGISTRY_HOST/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')/docs"
          printf '%s' "$PACKAGE_TOKEN" | docker login "$REGISTRY_HOST" -u "$ACTOR" --password-stdin
          docker build -f docs/Dockerfile -t "$IMAGE:latest" -t "$IMAGE:$COMMIT_SHA" docs
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$COMMIT_SHA"
