name: Docker

on:
  push:
    branches: [main]

# GITEA_TOKEN cannot publish packages. Create a personal access token with
# "packages:write" for the "admin" user and store it as the repository secret
# PACKAGE_TOKEN. The token owner must match REGISTRY_USER (org/repo variable,
# defaults to "admin").
env:
  # Required for Dockerfile features like RUN --mount=type=cache.
  DOCKER_BUILDKIT: "1"

permissions:
  contents: read
  packages: write

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker CLI
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker version
            exit 0
          fi
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends docker.io
          docker version

      - name: Build and push service image
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITEA_TOKEN }}
          REGISTRY_HOST: git.figfit.ir
          REPOSITORY: ${{ gitea.repository }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER || 'admin' }}
          COMMIT_SHA: ${{ gitea.sha }}
        run: |
          IMAGE="$REGISTRY_HOST/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')/service"
          printf '%s' "$PACKAGE_TOKEN" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
          docker build -f apps/service/Dockerfile -t "$IMAGE:latest" -t "$IMAGE:$COMMIT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$COMMIT_SHA"

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker CLI
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker version
            exit 0
          fi
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends docker.io
          docker version

      - name: Build and push docs image
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITEA_TOKEN }}
          REGISTRY_HOST: git.figfit.ir
          REPOSITORY: ${{ gitea.repository }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER || 'admin' }}
          COMMIT_SHA: ${{ gitea.sha }}
        run: |
          IMAGE="$REGISTRY_HOST/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')/docs"
          printf '%s' "$PACKAGE_TOKEN" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
          docker build -f docs/Dockerfile -t "$IMAGE:latest" -t "$IMAGE:$COMMIT_SHA" docs
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$COMMIT_SHA"
